name: Export YOLO26 models
description: Pinned x86 CPU conversion and tensor smoke test
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install pinned CPU export toolchain
      shell: bash
      working-directory: 05-MobilApp/Android/VisionLab
      run: |
        python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
        python -m pip install 'ultralytics==8.4.82' 'tensorflow==2.19.0' 'tf-keras==2.19.0' 'onnx2tf==1.28.8' 'onnx==1.17.0' 'onnxruntime==1.23.2' 'onnxslim==0.1.82' 'sng4onnx==1.0.4' 'onnx-graphsurgeon==0.5.8' 'ai-edge-litert==1.4.0' 'protobuf>=5,<6'
    - name: Export and smoke-test official nano, small and medium models
      shell: bash
      working-directory: 05-MobilApp/Android/VisionLab
      run: |
        python tools/export_models.py --sizes n s m --destination exported-models
        python tools/verify_models.py --assets exported-models --smoke-image tools/testdata/bus.jpg --report exported-models/model-smoke-report.json
    - name: Record complete environment
      if: always()
      shell: bash
      working-directory: 05-MobilApp/Android/VisionLab
      run: python -m pip freeze > export-environment.txt
    - name: Publish models and provenance
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: visionlab-yolo26-float16
        path: |
          05-MobilApp/Android/VisionLab/exported-models/
          05-MobilApp/Android/VisionLab/export-environment.txt
        if-no-files-found: error
