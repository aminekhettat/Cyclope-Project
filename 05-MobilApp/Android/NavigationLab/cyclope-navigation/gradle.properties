org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- Canonical single-source version (bump2version equivalent) ---
# Only source of truth for versionName/versionCode; modules read these properties.
# Bump with:  ./gradlew bumpVersion -Pbump=patch|minor|major|code
# Anti-drift gate (CI): ./gradlew verifyVersionSingleSource
cyclopeVersionName=0.1.0
cyclopeVersionCode=1
