name: VisionLab CI

on:
  push:
    branches: [CYCLOPE_GEN3_AndroidVision]
    paths:
      - '05-MobilApp/Android/VisionLab/**'
      - '.github/workflows/android-visionlab-ci.yml'
  pull_request:
    branches: [CYCLOPE_GEN3_AndroidVision]
    paths:
      - '05-MobilApp/Android/VisionLab/**'
      - '.github/workflows/android-visionlab-ci.yml'
  workflow_dispatch:
    inputs:
      export_models:
        description: 'Manual x86 export only (branch-only workflow bootstrap)'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: visionlab-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.export_models && 'export' || 'quality' }}
  cancel-in-progress: true

jobs:
  export-models:
    if: github.event_name == 'workflow_dispatch' && inputs.export_models
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      TF_NUM_INTRAOP_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: ./05-MobilApp/Android/VisionLab/tools/export-action
  quality-and-apk:
    if: github.event_name != 'workflow_dispatch' || !inputs.export_models
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: 05-MobilApp/Android/VisionLab
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Version anti-drift
        run: ./gradlew --no-daemon verifyVersionSingleSource
      - name: Shared voicekit architecture boundary
        run: ./gradlew --no-daemon :voicekit:verifySharedBoundary
      - name: Blocking ktlint
        run: ./gradlew --no-daemon ktlintCheck
      - name: Offline JVM tests and JaCoCo
        run: ./gradlew --no-daemon :vision:test :vision:jacocoTestReport :vision:jacocoTestCoverageVerification :voicekit:testDebugUnitTest :voicekit:jacocoTestReport :voicekit:jacocoTestCoverageVerification
      - name: Android lint including static accessibility checks
        run: ./gradlew --no-daemon :app:lintDebug :voicekit:lintDebug
      - name: Dokka API documentation
        run: ./gradlew --no-daemon :vision:dokkaHtml :voicekit:dokkaHtml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify bundled model hashes and real CPU inference
        run: |
          python -m pip install 'ai-edge-litert==1.4.0' 'numpy==1.26.4' 'pillow==11.3.0'
          python tools/verify_models.py --smoke-image tools/testdata/bus.jpg --report model-smoke-report.json
      - name: Assemble real debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Verify APK contains byte-identical mmap-ready models
        run: python tools/verify_models.py --apk app/build/outputs/apk/debug/app-debug.apk --report apk-model-report.json
      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: visionlab-debug-apk
          path: 05-MobilApp/Android/VisionLab/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visionlab-quality-reports
          path: |
            05-MobilApp/Android/VisionLab/model-smoke-report.json
            05-MobilApp/Android/VisionLab/apk-model-report.json
            05-MobilApp/Android/VisionLab/vision/build/reports/
            05-MobilApp/Android/VisionLab/vision/build/test-results/
            05-MobilApp/Android/VisionLab/vision/build/dokka/
            05-MobilApp/Android/VisionLab/voicekit/build/reports/
            05-MobilApp/Android/VisionLab/voicekit/build/test-results/
            05-MobilApp/Android/VisionLab/voicekit/build/dokka/
            05-MobilApp/Android/VisionLab/app/build/reports/
            05-MobilApp/Android/VisionLab/build/reports/ktlint/
          if-no-files-found: warn
