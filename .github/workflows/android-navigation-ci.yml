# NavigationLab CI - scoped to the Android navigation brick only.
# Sub-project: 05-MobilApp/Android/NavigationLab/cyclope-navigation
#
# Scope notes:
# - JVM quality gates remain in the quality job; app runtime smoke tests run
#   separately on a macOS Android emulator during a non-blocking trial period.
# - ktlint runs in report-only mode (ignoreFailures=true in navigation/build.gradle.kts):
#   existing code is not rewritten for style.
# - Version single-source rule: cyclopeVersionName/cyclopeVersionCode live in
#   gradle.properties; verifyVersionSingleSource is the anti-drift gate.

name: NavigationLab CI

on:
  workflow_dispatch:
  push:
    branches: [ CYCLOPE_GEN3_AndroidNavigation ]
    paths:
      - "05-MobilApp/Android/NavigationLab/**"
      - ".github/workflows/android-navigation-ci.yml"
  pull_request:
    branches: [ CYCLOPE_GEN3_AndroidNavigation ]
    paths:
      - "05-MobilApp/Android/NavigationLab/**"
      - ".github/workflows/android-navigation-ci.yml"

concurrency:
  group: navlab-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test / coverage / lint / docs / version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05-MobilApp/Android/NavigationLab/cyclope-navigation
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Version anti-drift check (single source = gradle.properties)
        run: ./gradlew --no-daemon verifyVersionSingleSource

      - name: Shared voicekit provenance and accessibility contracts
        run: |
          python3 tools/verify_shared_voicekit.py
          python3 tools/verify_accessibility_contract.py
          ./gradlew --no-daemon :voicekit:verifySharedBoundary

      - name: ktlint (navigation report-only, shared voice and adapters blocking)
        run: ./gradlew --no-daemon :navigation:ktlintCheck :voicekit:ktlintCheck :app:ktlintCheck

      - name: Unit tests + JaCoCo coverage gate
        run: ./gradlew --no-daemon :navigation:testDebugUnitTest :navigation:jacocoTestReport :navigation:jacocoTestCoverageVerification :voicekit:testDebugUnitTest :voicekit:jacocoTestReport :voicekit:jacocoTestCoverageVerification :app:testDebugUnitTest

      - name: Dokka HTML documentation
        run: ./gradlew --no-daemon :navigation:dokkaHtml :voicekit:dokkaHtml

      - name: Android lint (app and shared accessibility module)
        run: ./gradlew --no-daemon :app:lintDebug :voicekit:lintDebug

      - name: Assemble real navigation debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload navigation debug APK
        uses: actions/upload-artifact@v4
        with:
          name: navigation-debug-apk
          path: 05-MobilApp/Android/NavigationLab/cyclope-navigation/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload shared voicekit and host quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-voicekit-quality
          path: |
            05-MobilApp/Android/NavigationLab/cyclope-navigation/voicekit/build/reports/
            05-MobilApp/Android/NavigationLab/cyclope-navigation/voicekit/build/test-results/
            05-MobilApp/Android/NavigationLab/cyclope-navigation/voicekit/build/dokka/
            05-MobilApp/Android/NavigationLab/cyclope-navigation/app/build/reports/
            05-MobilApp/Android/NavigationLab/cyclope-navigation/app/build/test-results/
          if-no-files-found: warn

      - name: Upload JaCoCo report (XML + HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-jacoco-report
          path: 05-MobilApp/Android/NavigationLab/cyclope-navigation/navigation/build/reports/jacoco/
          if-no-files-found: warn

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-test-results
          path: 05-MobilApp/Android/NavigationLab/cyclope-navigation/navigation/build/reports/tests/
          if-no-files-found: warn

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-ktlint-reports
          path: 05-MobilApp/Android/NavigationLab/cyclope-navigation/navigation/build/reports/ktlint/
          if-no-files-found: ignore

      - name: Upload Dokka HTML docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-dokka-html
          path: 05-MobilApp/Android/NavigationLab/cyclope-navigation/navigation/build/dokka/
          if-no-files-found: warn

  instrumented-tests:
    name: Instrumented smoke tests (non-blocking trial)
    runs-on: macos-latest
    # Trial period: failures are non-blocking until the product owner enables this gate.
    continue-on-error: true
    timeout-minutes: 35
    defaults:
      run:
        working-directory: 05-MobilApp/Android/NavigationLab/cyclope-navigation
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build app and instrumented test APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run app connectedCheck on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: arm64-v8a
          disable-animations: true
          emulator-boot-timeout: 900
          working-directory: 05-MobilApp/Android/NavigationLab/cyclope-navigation
          pre-emulator-launch-script: '"$ANDROID_HOME/emulator/emulator" -accel-check'
          script: ./gradlew --no-daemon :app:connectedCheck

      - name: Verify instrumented tests actually ran
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = list(Path("app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          cases = [case for report in reports for case in ET.parse(report).iter("testcase")]
          failed = [case for case in cases if case.find("failure") is not None or case.find("error") is not None]
          skipped = [case for case in cases if case.find("skipped") is not None]
          print(f"Instrumented results: {len(cases)} tests, {len(failed)} failed, {len(skipped)} skipped")
          assert len(cases) >= 2 and not failed and not skipped, "Expected at least two passing runtime smoke tests"
          PYTHON

      - name: Upload instrumented test reports (HTML + XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-instrumented-test-results
          path: |
            05-MobilApp/Android/NavigationLab/cyclope-navigation/app/build/reports/androidTests/connected/
            05-MobilApp/Android/NavigationLab/cyclope-navigation/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
