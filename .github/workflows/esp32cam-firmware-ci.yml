name: ESP32Cam firmware CI

on:
  push:
    branches: [CYCLOPE_GEN3_ESP32CAMSW]
    paths:
      - '02-Embedded/01-Software/ESP32Cam_Cyclope_III/**'
      - '.github/workflows/esp32cam-firmware-ci.yml'
  pull_request:
    branches: [CYCLOPE_GEN3_ESP32CAMSW]
    paths:
      - '02-Embedded/01-Software/ESP32Cam_Cyclope_III/**'
      - '.github/workflows/esp32cam-firmware-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esp32cam-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Compile and quality reports
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: 02-Embedded/01-Software/ESP32Cam_Cyclope_III
    # No real-target tests: no ESP32 board is connected to GitHub-hosted runners.
    # Later, the team may add a self-hosted runner with a USB board for hardware tests.
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2.1.0
        with:
          version: '1.5.1'
      - name: Verify canonical firmware version (blocking)
        run: python3 scripts/quality.py version
      - name: Install pinned ESP32 core
        run: python3 scripts/quality.py install
      - name: Compile firmware (blocking)
        run: |
          mkdir -p .build/reports
          set -o pipefail
          python3 scripts/quality.py compile 2>&1 | tee .build/reports/compile.log
      - name: Cppcheck report (advisory)
        if: always()
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cppcheck
          python3 scripts/quality.py cppcheck
      - name: Upload firmware and quality reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: esp32cam-firmware-${{ github.sha }}
          path: |
            02-Embedded/01-Software/ESP32Cam_Cyclope_III/.build/firmware/*.elf
            02-Embedded/01-Software/ESP32Cam_Cyclope_III/.build/firmware/*.bin
            02-Embedded/01-Software/ESP32Cam_Cyclope_III/.build/firmware/version.json
            02-Embedded/01-Software/ESP32Cam_Cyclope_III/.build/reports/
          include-hidden-files: true # Explicit allowlist above lives under .build/.
          if-no-files-found: error
          retention-days: 14
